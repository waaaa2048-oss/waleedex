<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b2e" />
    <title>أهل الكرم</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf7ef; color: #12211c; font-family: system-ui, sans-serif; text-align: center; }
      main { width: min(420px, 100%); padding: 34px 24px; border: 1px solid #e9dfcf; border-radius: 28px; background: #fff; box-shadow: 0 24px 70px -35px #0b3b2e66; }
      .logo { width: 76px; height: 76px; margin: auto; display: grid; place-items: center; border-radius: 24px; background: #0b3b2e; color: #c9a227; font-size: 34px; }
      h1 { margin: 20px 0 6px; font-size: 22px; }
      p { color: #776d60; font-size: 13px; line-height: 1.9; }
      button { margin-top: 16px; padding: 13px 22px; border: 0; border-radius: 14px; background: #0b3b2e; color: #fff; font-weight: 800; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">✦</div>
      <h1>أهل الكرم | عشاك جاهز</h1>
      <p>تعذر الاتصال بالمتجر. تأكد من اتصال الإنترنت ثم أعد المحاولة. ستظهر تحديثات المتجر تلقائياً عند الاتصال.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
